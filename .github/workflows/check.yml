name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The SDK's guest-check bin has a `#!/usr/bin/env bun` shebang.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code
      - run: npx --no-install openchamber-guest-check
